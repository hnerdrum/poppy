services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poppy
      POSTGRES_PASSWORD: poppy
      POSTGRES_DB: poppy_test
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poppy -d poppy_test"]
      interval: 2s
      timeout: 5s
      retries: 10
