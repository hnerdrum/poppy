name: poppy
version: 1.0.0
github: "hnerdrum/poppy"
license: BSD3
license-file: LICENSE
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023–2026 Henrik Nerdrum"
category: Database
stability: stable
tested-with: GHC == 9.4.8, GHC == 9.10.3
synopsis: Postgres runtime for generated Poppy Clients
description: |
  Runtime used by Clients generated by poppy-codegen.
  Application code imports this package to query and write Postgres.

extra-source-files:
  - test/migrations/*.sql
  - include-fail/*.hs
  - unique-fail/*.hs

extra-doc-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - aeson >= 2.0 && < 2.3
  - base >= 4.17 && < 4.21
  - bytestring >= 0.11 && < 0.13
  - containers >= 0.6 && < 0.8
  - directory >= 1.3 && < 1.4
  - filepath >= 1.4 && < 1.6
  - mtl >= 2.2 && < 2.4
  - postgresql-simple >= 0.6 && < 0.8
  - resource-pool >= 0.4 && < 0.5
  - scientific >= 0.3.4 && < 0.4
  - text >= 2.0 && < 2.2
  - time >= 1.12 && < 1.15
  - uuid >= 1.3 && < 1.4

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Poppy
    - Poppy.Internal.Generated
    - Poppy.Internal.Column
    - Poppy.Internal.Core
    - Poppy.Internal.Db
    - Poppy.Internal.Delete
    - Poppy.Internal.Errors
    - Poppy.Internal.Group
    - Poppy.Internal.Include
    - Poppy.Internal.Insert
    - Poppy.Internal.Migrate
    - Poppy.Internal.Operations
    - Poppy.Internal.PG
    - Poppy.Internal.Query
    - Poppy.Internal.Select
    - Poppy.Internal.SelectIn
    - Poppy.Internal.Sql
    - Poppy.Internal.Update
    - Poppy.Internal.Where
  default-extensions:
    - DuplicateRecordFields
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings
    - TypeFamilies

tests:
  poppy-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - poppy
      - hspec >= 2.11 && < 2.13
      - process >= 1.6 && < 1.7
    default-extensions:
      - AllowAmbiguousTypes
      - DuplicateRecordFields
      - LambdaCase
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - ScopedTypeVariables
      - TypeApplications
      - TypeFamilies
