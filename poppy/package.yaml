name: poppy
version: 0.1.0.0
github: "hnerdrum/poppy"
license: BSD3
license-file: LICENSE
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023–2026 Henrik Nerdrum"
category: Database
tested-with: GHC == 9.4.8
synopsis: Schema-to-Client codegen runtime for Postgres
description: |
  Runtime library for Poppy. Write a Schema, generate a Client with
  poppy-codegen, then query and write through that Client.

  Poppy is Postgres-only. It does not generate SQL migrations; keep
  Schema and the database aligned with hand-written SQL and
  --check-schema.

extra-source-files:
  - test/migrations/*.sql

extra-doc-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - base >= 4.17 && < 4.18
  - bytestring >= 0.11 && < 0.12
  - containers >= 0.6 && < 0.7
  - mtl >= 2.2 && < 2.3
  - postgresql-simple >= 0.6 && < 0.8
  - resource-pool >= 0.4 && < 0.5
  - text >= 2.0 && < 2.1
  - time >= 1.12 && < 1.13
  - uuid >= 1.3 && < 1.4

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Poppy
    - Poppy.Column
    - Poppy.Core
    - Poppy.Db
    - Poppy.Delete
    - Poppy.Errors
    - Poppy.Group
    - Poppy.Include
    - Poppy.Insert
    - Poppy.JoinChain
    - Poppy.Operations
    - Poppy.PG
    - Poppy.Query
    - Poppy.Relation
    - Poppy.Select
    - Poppy.SelectIn
    - Poppy.Sql
    - Poppy.Update
    - Poppy.Where
  default-extensions:
    - DuplicateRecordFields
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings
    - TypeFamilies

tests:
  poppy-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - poppy
      - directory >= 1.3 && < 1.4
      - filepath >= 1.4 && < 1.5
      - hspec >= 2.11 && < 2.12
    default-extensions:
      - AllowAmbiguousTypes
      - DuplicateRecordFields
      - LambdaCase
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - ScopedTypeVariables
      - TypeApplications
      - TypeFamilies
