name: poppy
version: 0.1.0.0
github: "hnerdrum/poppy"
license: BSD3
license-file: LICENSE
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023–2026 Henrik Nerdrum"
category: Database
synopsis: Prisma-style Schema to Client codegen runtime for Postgres
description: Runtime library for Poppy. Write a Schema, generate a Client, then query and write through that Client.

extra-source-files:
  - test/migrations/*.sql

dependencies:
  - base >= 4.7 && < 5
  - bytestring
  - containers
  - mtl
  - postgresql-simple
  - resource-pool
  - text
  - time
  - uuid

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Poppy
    - Poppy.Column
    - Poppy.Core
    - Poppy.Db
    - Poppy.Delete
    - Poppy.Errors
    - Poppy.Group
    - Poppy.Include
    - Poppy.Insert
    - Poppy.JoinChain
    - Poppy.Operations
    - Poppy.PG
    - Poppy.Query
    - Poppy.Relation
    - Poppy.Select
    - Poppy.SelectIn
    - Poppy.Sql
    - Poppy.Update
    - Poppy.Where
  default-extensions:
    - DuplicateRecordFields
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings
    - TypeFamilies

tests:
  poppy-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - poppy
      - directory
      - filepath
      - hspec
    default-extensions:
      - AllowAmbiguousTypes
      - DuplicateRecordFields
      - LambdaCase
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - ScopedTypeVariables
      - TypeApplications
      - TypeFamilies
