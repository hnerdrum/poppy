name: poppy-codegen
version: 0.1.0.0
github: "hnerdrum/poppy"
license: BSD3
license-file: LICENSE
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023–2026 Henrik Nerdrum"
category: Database
tested-with: GHC == 9.4.8, GHC == 9.10.3
synopsis: Schema builder and Client codegen for Poppy
description: |
  Write a Schema, generate table types and a Client, and compare that
  Schema to live Postgres.

extra-source-files:
  - test/migrations/*.sql
  - test/Poppy/Codegen/golden/*.golden

extra-doc-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - base >= 4.17 && < 4.21
  - containers >= 0.6 && < 0.8
  - directory >= 1.3 && < 1.4
  - filepath >= 1.4 && < 1.6
  - poppy >= 0.1 && < 0.2
  - postgresql-simple >= 0.6 && < 0.8
  - text >= 2.0 && < 2.2

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Poppy.Codegen.CLI
    - Poppy.Codegen.Drift
    - Poppy.Codegen.IR
    - Poppy.Codegen.Run
    - Poppy.Codegen.Schema
    - Poppy.Codegen.Target
    - Poppy.Codegen.Validate
  other-modules:
    - Poppy.Codegen.Combinator
    - Poppy.Codegen.Emit.Client
    - Poppy.Codegen.Emit.Combinator
    - Poppy.Codegen.Emit.FlatRow
    - Poppy.Codegen.Emit.Include
    - Poppy.Codegen.Emit.Nest
    - Poppy.Codegen.Emit.Schema
    - Poppy.Codegen.Emit.SelectIn
    - Poppy.Codegen.EmitCommon
    - Poppy.Codegen.IncludePath
    - Poppy.Codegen.Introspect
    - Poppy.Codegen.JoinAlias
    - Poppy.Codegen.Lookup
    - Poppy.Codegen.TextUtil
  default-extensions:
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings

# Compile library sources with the test suite so hidden Emit/JoinAlias/IncludePath
# modules can be unit-tested without exposing them to consumers.
tests:
  poppy-codegen-test:
    main: Spec.hs
    source-dirs:
      - test
      - src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - poppy
      - bytestring >= 0.11 && < 0.13
      - hspec >= 2.11 && < 2.13
      - mtl >= 2.2 && < 2.4
      - resource-pool >= 0.4 && < 0.5
      - time >= 1.12 && < 1.15
      - uuid >= 1.3 && < 1.4
    default-extensions:
      - AllowAmbiguousTypes
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - TypeApplications
