name: poppy-codegen
version: 0.1.0.0
github: "hnerdrum/poppy"
license: BSD3
license-file: LICENSE
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023–2026 Henrik Nerdrum"
category: Database
synopsis: Schema builder and Client codegen for Poppy
description: Codegen library for Poppy. Describe models as Haskell values, emit table types and a Client, and drift-check against live Postgres.

extra-source-files:
  - test/migrations/*.sql
  - test/ORM/Codegen/golden/*.golden

dependencies:
  - base >= 4.7 && < 5
  - containers
  - directory
  - filepath
  - poppy
  - postgresql-simple
  - text

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - ORM.Codegen.CLI
    - ORM.Codegen.Drift
    - ORM.Codegen.IR
    - ORM.Codegen.Run
    - ORM.Codegen.Schema
    - ORM.Codegen.Target
    - ORM.Codegen.Validate
  other-modules:
    - ORM.Codegen.Combinator
    - ORM.Codegen.Emit.Client
    - ORM.Codegen.Emit.Combinator
    - ORM.Codegen.Emit.FlatRow
    - ORM.Codegen.Emit.Include
    - ORM.Codegen.Emit.Nest
    - ORM.Codegen.Emit.Schema
    - ORM.Codegen.Emit.SelectIn
    - ORM.Codegen.EmitCommon
    - ORM.Codegen.IncludePath
    - ORM.Codegen.Introspect
    - ORM.Codegen.JoinAlias
    - ORM.Codegen.Lookup
    - ORM.Codegen.TextUtil
  default-extensions:
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings

# Compile library sources with the test suite so hidden Emit/JoinAlias/IncludePath
# modules can be unit-tested without exposing them to consumers.
tests:
  poppy-codegen-test:
    main: Spec.hs
    source-dirs:
      - test
      - src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - poppy
      - bytestring
      - hspec
      - mtl
      - resource-pool
      - time
      - uuid
    default-extensions:
      - AllowAmbiguousTypes
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - TypeApplications
