name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (GHC ${{ matrix.ghc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.4.8", "9.10.3"]
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgres://poppy:poppy@127.0.0.1:5432/poppy_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: poppy
          POSTGRES_PASSWORD: poppy
          POSTGRES_DB: poppy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poppy -d poppy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
          cabal-update: true

      - name: Plan
        run: cabal build all --enable-tests --dry-run

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Check hpack is in sync
        run: |
          cabal install hpack-0.35.2 --overwrite-policy=always --install-method=copy --installdir="$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          (cd poppy && hpack)
          (cd poppy-codegen && hpack)
          (cd examples/task && hpack)
          git diff --exit-code

      - name: Test
        run: cabal test all

      - name: Haddock
        run: cabal haddock all

      - name: cabal check
        run: |
          (cd poppy && cabal check)
          (cd poppy-codegen && cabal check)

      - name: sdist
        run: cabal sdist all
